services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: ehr-clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --database \"$$CLICKHOUSE_DB\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - ehr-network
    restart: "unless-stopped"
  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: ehr-spark:latest
    container_name: ehr-spark
    ports:
      - "127.0.0.1:8888:8888" 
    entrypoint: ["/bin/bash", "-c", "tail -f /dev/null"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    command: >
      jupyter lab 
      --ip=0.0.0.0 
      --port=8888 
      --no-browser 
      --ServerApp.token='' 
      --ServerApp.password='' 
      --ServerApp.allow_origin='*' 
      --notebook-dir=/opt/spark
    volumes:
      - spark_ivy_cache:/home/spark/.ivy2
      - ./scripts:/opt/spark/scripts
      - ./sql:/opt/spark/sql
      - ./notebooks/:/opt/spark/notebooks
    networks:
      - ehr-network
    restart: "unless-stopped"
  grafana:
    image: grafana/grafana:11.2.0
    container_name: ehr-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECUTIRY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: vertamedia-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ehr-network
    restart:
      "unless-stopped"


volumes:
  clickhouse_data:
  grafana_data:

networks:
  ehr-network:
    driver: bridge